[project]
name = "bot-fii-sentimento"
version = "0.1.0"
description = "Bot de sentimento de notícias e sugestão de FIIs (MVP, IA/ML)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "yfinance>=0.2",
    "telegram-lite>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bot-fii-sentimento = "bot_fii_sentimento.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
